name: Sync Blog Posts from trilliumsmith.com

on:
  schedule:
    # Run daily at 2 AM UTC to check for new blog posts
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trillium repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch and process blog posts from RSS
        run: |
          node << 'EOF'
          const fs = require('fs');

          async function fetchBlogPosts() {
            console.log('Fetching blog posts from RSS feed...');

            const response = await fetch('https://trilliumsmith.com/feed.xml');
            const rssText = await response.text();

            // Simple XML parsing for RSS feed
            const posts = [];
            const itemRegex = /<item>([\s\S]*?)<\/item>/g;
            let match;

            while ((match = itemRegex.exec(rssText)) !== null) {
              const item = match[1];

              const titleMatch = item.match(/<title[^>]*>(.+?)<\/title>/);
              const linkMatch = item.match(/<link[^>]*>(.+?)<\/link>/);
              const descMatch = item.match(/<description[^>]*>(.+?)<\/description>/);
              const dateMatch = item.match(/<pubDate[^>]*>(.+?)<\/pubDate>/);
              const categoryMatches = item.match(/<category>(.+?)<\/category>/g) || [];

              if (titleMatch && linkMatch && dateMatch) {
                const date = new Date(dateMatch[1]).toISOString().split('T')[0];
                const tags = categoryMatches.map(c => c.replace(/<\/?category>/g, ''));

                posts.push({
                  title: titleMatch[1].replace(/&[^;]+;/g, char => {
                    const entities = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'" };
                    return entities[char] || char;
                  }),
                  url: linkMatch[1],
                  summary: descMatch ? descMatch[1].replace(/&[^;]+;/g, char => {
                    const entities = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'" };
                    return entities[char] || char;
                  }) : '',
                  date,
                  tags
                });
              }
            }

            // Sort by date (newest first)
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));
            console.log(`✓ Found ${posts.length} blog posts`);

            return posts;
          }

          fetchBlogPosts().then(posts => {
            const output = {
              updated: new Date().toISOString(),
              recentPosts: posts.slice(0, 10),
              totalPosts: posts.length
            };

            // Write JSON data
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/blog-posts.json', JSON.stringify(output, null, 2));

            // Generate markdown
            const markdown = `# Latest Blog Posts

> Auto-synced from [trilliumsmith.com](https://trilliumsmith.com)

${output.recentPosts.map(post =>
              `- **[${post.title}](${post.url})** (${post.date})
  - ${post.summary}${post.tags.length ? `\n  - Tags: ${post.tags.join(', ')}` : ''}`
            ).join('\n\n')}

[View all ${output.totalPosts} blog posts →](https://trilliumsmith.com/blog)
`;

            fs.writeFileSync('BLOG.md', markdown);
            console.log('✓ Generated BLOG.md and blog-posts.json');
          });
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/blog-posts.json BLOG.md 2>/dev/null; then
            echo "No changes to commit"
          else
            git add data/blog-posts.json BLOG.md
            git commit -m "chore: sync recent blog posts from trilliumsmith.com" || echo "No changes to commit"
            git push
          fi
