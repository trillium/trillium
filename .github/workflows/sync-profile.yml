name: Sync Profile Content

on:
  schedule:
    # Run daily at 2 AM UTC to check for new blog posts
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/projects.json'
      - 'scripts/**'
      - '.github/workflows/sync-profile.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch blog posts from RSS
        run: node scripts/fetch-blog-posts.js

      - name: Generate rowing activity SVG
        run: node scripts/generate-rowing-svg.js

      - name: Regenerate README sections and BLOG.md
        run: node scripts/generate-readme.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md BLOG.md data/blog-posts.json images/rowing.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync profile content (blog posts + projects)"
            git push
          fi
